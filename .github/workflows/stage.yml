name: storyos stage gate

# verify_stage.py runs here through framework/scripts/ci_run.py. The
# dragon_prince_yuan stage carries four DOCUMENTED staleness issues whose
# source is not in this account and whose resolution is the author's ruling
# (AUDIT_2026-10-11_STALE_STAGE_AND_SCOPE.md); CI pins exactly those and fails
# on ANY issue beyond them.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: verify the published stage (pinned dragon_prince set)
        run: python3 framework/scripts/ci_run.py
